name: astrbot_plugin_new_qq_tools
display_name: QQ工具集
version: v0.2.2
author: YanZephyr (原作者: YUMU1658)
desc: "为 AstrBot 提供 QQ 平台（OneBot / aiocqhttp）特定的工具集：引用回复、撤回消息、检索最近消息、群管理、头像查看、网页浏览（Playwright）、视频分析（Gemini）、以及「定时唤醒」等能力。\n本项目基于原作者 YUMU1658/astrbot_plugin_qq_tools 接续维护开发，修复了协议端无载荷空事件导致的误触发与幻觉等问题。"
repo: https://github.com/YanZephyr14/astrbot_plugin_new_qq_tools